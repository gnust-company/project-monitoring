# All configuration lives in `.env` (copy from `.env.example`) — compose sets no values of its own:
#   - `env_file: .env`  → environment variables for each container
#   - `${VAR}` in this file (ports only) → also read by compose from `.env`
# A missing variable makes compose/backend fail immediately instead of silently using a default.
services:
  postgres:
    image: postgres:16-alpine
    env_file: .env          # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is missing in .env}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file: .env          # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD
    ports:
      - "${MINIO_API_PORT:?MINIO_API_PORT is missing in .env}:9000"           # S3 API
      - "${MINIO_CONSOLE_PORT:?MINIO_CONSOLE_PORT is missing in .env}:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the attachments + avatars buckets, then exits
  minio-setup:
    image: minio/mc:latest
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb -p local/attachments;
      mc mb -p local/avatars;
      mc anonymous set download local/avatars;
      mc anonymous set download local/attachments;
      exit 0;
      "

  backend:
    build: ./backend
    image: projecthub-backend:latest   # fixed name so the image can be saved/loaded or pushed to a registry
    env_file: .env          # POSTGRES_*, JWT_SECRET, CORS_ORIGINS, MINIO_* …
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:?BACKEND_PORT is missing in .env}:8000"
    command: >
      /bin/sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    image: projecthub-frontend:latest   # fixed name so the image can be saved/loaded or pushed to a registry
    # VITE_API_BASE is read at RUNTIME (runtime-env.js) — to change the IP/port just edit .env and
    # run `docker compose up -d frontend`; NO image rebuild needed.
    env_file: .env
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:?FRONTEND_PORT is missing in .env}:80"

volumes:
  pgdata:
  miniodata:
